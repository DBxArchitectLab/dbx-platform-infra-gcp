cluster_policies:
  shared_compute_customize:
    description: "Shared all-purpose compute with user isolation."
    definition:
      node_type_id:
        type: unlimited
        defaultValue: n2-standard-4
      data_security_mode:
        type: fixed
        value: USER_ISOLATION
      cluster_type:
        type: fixed
        value: all-purpose
      gcp_attributes.availability:
        type: unlimited
        defaultValue: ON_DEMAND_GCP
      gcp_attributes.zone_id:
        type: unlimited
        defaultValue: HA
      autoscale.min_workers:
        type: fixed
        value: 1
      autoscale.max_workers:
        type: fixed
        value: 1
      autotermination_minutes:
        type: unlimited
        defaultValue: 120
