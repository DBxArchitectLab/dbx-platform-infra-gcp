external_location:
  name: "ext_loc_dbx_architect_lab_prod"
  # Unity Catalog owner (defaults to the first grant_principals entry if omitted). Set to a group your Terraform identity belongs to, or the deployment service account, so in-place updates succeed.
  # owner: "DBX_Architect_Lab_Admin"
  # If null, Terraform uses "<name>_cred" (see workspace_bootstrap module).
  # On GCP the storage credential is backed by a Databricks-managed GCP service account; Terraform grants it
  # access to the bucket from gcs-storage-config.yaml.
  storage_credential_name: null
  enable_grants: true
  # Principals that should manage this location via Terraform must have MANAGE (included in default privileges below).
  # The first entry is the default owner. Group names, user emails or service principal application IDs. The deployment
  # service account (DEPLOY_PRINCIPAL, defaults to DATABRICKS_GOOGLE_SERVICE_ACCOUNT) is added automatically.
  grant_principals:
    - "DBX_Architect_Lab_Admin"
    - "dbxarchitectlab@gmail.com"
  grant_privileges:
    - "MANAGE"
    - "READ_FILES"
    - "WRITE_FILES"
    - "CREATE_EXTERNAL_TABLE"
  # If apply fails updating the external location before grants run, either:
  # - run once as a metastore admin, or
  # - have an admin run: GRANT MANAGE ON EXTERNAL LOCATION `ext_loc_dbx_architect_lab_prod` TO `<deployment service account email>`;
  # - or: terragrunt apply -target=module.external_location.databricks_grants.external_location[0]
  #   then a full apply (adjust module path if your state differs).
