name: Terragrunt Deploy Stacks
# Title of each run in the Actions list, e.g. "apply dev-dbxarchitectlab-workspace (@DBxArchitectLab)".
run-name: ${{ inputs.action }} ${{ inputs.stack }} (@${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy
        type: choice
        required: true
        options:
          - metastore
          - dev-dbxarchitectlab-workspace
          - dev-dbxarchitectlab-workspace-bootstrap
          - uat-dbxarchitectlab-workspace
          - uat-dbxarchitectlab-workspace-bootstrap
          - prod-dbxarchitectlab-workspace
          - prod-dbxarchitectlab-workspace-bootstrap
      action:
        description: Terragrunt action
        type: choice
        required: true
        default: plan
        options:
          - validate
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terragrunt:
    runs-on: ubuntu-latest
    # prod-* and uat-* stacks use the matching GitHub environment; all others use "dev".
    environment: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
    env:
      TG_NON_INTERACTIVE: "true"
      STACK: ${{ inputs.stack }}
      ACTION: ${{ inputs.action }}
      TARGET_ENV: ${{ startsWith(inputs.stack, 'prod-') && 'prod' || startsWith(inputs.stack, 'uat-') && 'uat' || 'dev' }}
      DATABRICKS_ACCOUNT_ID: ${{ secrets.DATABRICKS_ACCOUNT_ID }}
      DATABRICKS_METASTORE_ID: ${{ secrets.DATABRICKS_METASTORE_ID }}
      # Databricks on GCP authenticates with Google-issued tokens: the Databricks provider impersonates this
      # service account (a Databricks account admin) through the credentials set up by google-github-actions/auth.
      # Its email is also the deployment principal granted on the catalog and external location by workspace-bootstrap.
      DATABRICKS_GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.6
          # The wrapper breaks Terragrunt's parsing of `terraform output` for dependency blocks.
          terraform_wrapper: false

      - name: Install Terragrunt
        run: |
          set -euo pipefail
          TG_VERSION="0.99.4"
          curl -sSL -o terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

      - name: Resolve stack path
        # "metastore" -> live/metastore, "<env>-dbxarchitectlab-<stack>" -> live/<env>/<stack>
        run: echo "STACK_PATH=live/${STACK/-dbxarchitectlab-//}" >> "$GITHUB_ENV"

      - name: Show deployment selection
        run: |
          {
            echo "### Terragrunt ${ACTION}: ${STACK}"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Stack | \`${STACK}\` |"
            echo "| Action | \`${ACTION}\` |"
            echo "| GitHub environment | \`${TARGET_ENV}\` |"
            echo "| Stack path | \`${STACK_PATH}\` |"
            echo "| Branch | \`${GITHUB_REF_NAME}\` |"
            echo "| Commit | \`${GITHUB_SHA::7}\` |"
            echo "| Started by | \`${GITHUB_ACTOR}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Terragrunt init
        working-directory: ${{ env.STACK_PATH }}
        run: terragrunt init -upgrade -no-color

      - name: Terragrunt ${{ inputs.action }}
        working-directory: ${{ env.STACK_PATH }}
        run: |
          case "$ACTION" in
            validate) terragrunt validate -no-color ;;
            plan)     terragrunt plan -no-color ;;
            apply)    terragrunt apply -auto-approve -no-color ;;
            destroy)  terragrunt destroy -auto-approve -no-color ;;
          esac
